<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOON · QR</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   테이블용 QR 카드 인쇄 페이지
     메뉴 주소를 넣으면 QR 카드가 만들어지고, 인쇄 버튼으로 출력.
     "테이블 번호"를 켜면 ?t=번호 가 붙은 QR 을 테이블 수만큼 만든다.
     (2차 목표 — 주문을 어느 테이블에서 했는지 POS 에 넘길 때 사용)
   ============================================================ */
:root {
  --navy:  #1e1a4b;
  --cream: #f2ede1;
  --paper: #f6f4ee;
  --ink:   #16143a;
  --ink-2: #6a6788;
  --font-en: "Poppins", system-ui, sans-serif;
  --font-ko: "Noto Sans KR", "Malgun Gothic", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ko); }

.panel {
  max-width: 720px; margin: 0 auto; padding: 28px 16px 8px;
  display: grid; gap: 12px;
}
.panel h1 { margin: 0 0 4px; font-family: var(--font-en); font-size: 1.3rem; color: var(--navy); }
.panel label { display: grid; gap: 4px; font-size: .85rem; color: var(--ink-2); }
.panel input[type=url], .panel input[type=number] {
  font: inherit; color: var(--ink); padding: 10px 12px;
  border: 1px solid #d8d4c6; border-radius: 8px; background: #fff;
}
.row { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
.row label { flex: 1; min-width: 140px; }
.check { display: flex !important; align-items: center; gap: 8px; color: var(--ink) !important; }
button {
  font: 500 .9rem var(--font-en); letter-spacing: .08em;
  padding: 11px 20px; border: 0; border-radius: 999px;
  background: var(--navy); color: var(--cream); cursor: pointer;
}

.sheet {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 16px;
  padding: 24px 16px 48px;
}

/* 카드 1장 = 테이블 위 스탠드 크기 (약 9 × 12.5cm) */
.card {
  width: 9cm; height: 12.5cm;
  background: var(--navy); color: var(--cream);
  border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 18px;
  break-inside: avoid;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.card__name { font: 700 1.9rem var(--font-en); letter-spacing: .04em; }
.card__qr { background: #fff; padding: 12px; border-radius: 8px; line-height: 0; }
.card__qr img, .card__qr canvas { width: 4.6cm; height: 4.6cm; }
.card__label { font: 500 .7rem var(--font-en); letter-spacing: .42em; padding-left: .42em; }
.card__ko { font-size: .72rem; opacity: .75; }
.card__table { font: 500 .75rem var(--font-en); letter-spacing: .2em; opacity: .8; }

@media print {
  @page { margin: 1cm; }
  body { background: #fff; }
  .panel { display: none; }
  .sheet { padding: 0; }
}
</style>
</head>
<body>

<form class="panel" id="form">
  <h1>NOON · QR 카드</h1>
  <label>메뉴 주소 (배포한 사이트 주소)
    <input type="url" id="url" required placeholder="https://noon-menu.example.com">
  </label>
  <div class="row">
    <label class="check"><input type="checkbox" id="perTable"> 테이블별 QR (?t=번호)</label>
    <label>테이블 수 <input type="number" id="tables" min="1" max="60" value="8"></label>
  </div>
  <div class="row">
    <button type="submit">만들기</button>
    <button type="button" id="print">인쇄</button>
  </div>
</form>

<div class="sheet" id="sheet"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
  "use strict";

  var form  = document.getElementById("form");
  var url   = document.getElementById("url");
  var per   = document.getElementById("perTable");
  var count = document.getElementById("tables");
  var sheet = document.getElementById("sheet");

  /* 이 페이지와 같은 사이트에 올려두면 주소를 자동으로 채움 */
  if (/^https?:/.test(location.protocol)) {
    url.value = location.href.replace(/qr\.html.*$/, "");
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function card(link, table) {
    var c = el("div", "card");
    c.appendChild(el("div", "card__name", "NOON"));
    var qr = el("div", "card__qr");
    c.appendChild(qr);
    c.appendChild(el("div", "card__label", "MENU"));
    c.appendChild(el("div", "card__ko", "QR을 찍어 메뉴를 확인하세요"));
    if (table) c.appendChild(el("div", "card__table", "TABLE " + table));
    /* 인쇄용이라 오류 보정 H (카드가 조금 긁혀도 읽힘) */
    new QRCode(qr, { text: link, width: 512, height: 512,
                     colorDark: "#1e1a4b", colorLight: "#ffffff",
                     correctLevel: QRCode.CorrectLevel.H });
    return c;
  }

  function build() {
    sheet.textContent = "";
    var base = url.value.trim();
    if (!base) return;
    if (!per.checked) { sheet.appendChild(card(base)); return; }
    var n = Math.max(1, Math.min(60, parseInt(count.value, 10) || 1));
    var sep = base.indexOf("?") < 0 ? "?" : "&";
    for (var i = 1; i <= n; i++) sheet.appendChild(card(base + sep + "t=" + i, i));
  }

  form.addEventListener("submit", function (e) { e.preventDefault(); build(); });
  document.getElementById("print").addEventListener("click", function () { build(); window.print(); });
  if (url.value) build();
})();
</script>
</body>
</html>
